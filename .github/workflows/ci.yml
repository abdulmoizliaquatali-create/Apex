name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend (syntax + boot check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check server sources
        working-directory: backend
        run: |
          for f in server.js store.js seed.js ledger.js fx.js auth.js supabase.js env.js; do
            node --check "$f"
          done
      - name: Boot smoke test
        working-directory: backend
        env:
          PORT: 3001
        run: |
          npm ci
          node server.js &
          sleep 3
          curl -fsS http://localhost:3001/api/health
          kill %1
